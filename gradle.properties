org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
org.gradle.daemon=false
org.gradle.parallel=false

# AGP 9's built-in Kotlin support (and its new DSL) conflicts with this
# module's explicit org.jetbrains.kotlin.android plugin application (which
# the `kotlin { }` compilerOptions block in build.gradle.kts relies on) —
# same two flags the proven-working trial app's android/gradle.properties
# already carries.
android.builtInKotlin=false
android.newDsl=false

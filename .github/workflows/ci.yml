# Engine CI on every push to main and every pull request (F-28): Rust tests
# (including the fuzz-invariant smoke test) and clippy, engine unit tests and
# the release AAR. Same pinned toolchain as release.yml. Publishing happens
# only in release.yml (on a version tag).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.99.0"
  CARGO_NDK_VERSION: "4.1.2"
  ANDROID_NDK_VERSION: "27.1.12297006"
  JAVA_VERSION: "17"

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Rust toolchain and Android targets
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy \
            --target aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          rustup default "$RUST_TOOLCHAIN"

      - name: cargo-ndk
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked

      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" > /dev/null
          test -f "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/source.properties"

      - name: Rust tests and clippy
        working-directory: native
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --target aarch64-linux-android -- -D warnings

      - name: Engine tests and release AAR
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease "-PraspEngineVersion=0.0.0-ci"

[package]
name = "raspshield"
version = "0.2.0"
edition = "2021"
publish = false
description = "Native core of the RASP Shield Android engine (libraspshield.so)"

[lib]
# cdylib: the Android library; rlib: cargo test and the fuzz harness.
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21", default-features = false }
sha2 = { version = "0.11", default-features = false }

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
strip = true
codegen-units = 1

[lints.rust]
# `unsafe` is allowed only in src/jni_entry.rs, block by block, each documented.
unsafe_code = "deny"
